<title>TOMOSHIBI — one call, through the switchboard</title>
<style>
  /* One call, through the switchboard: what the figure in the README says, moving.
     Everything on this page is drawn here; nothing is loaded from anywhere, and nothing is sent. */
  :root { --bg:#0F0D15; --ink:#F4F1EA; --mut:#8E88A0; --line:#3A3550; --card:#1A1724; --lemon:#FFF05A; --flame:#F2600C; --ok:#35D49A; --no:#FF5D8F; --pur:#A78BFA }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; overflow:hidden }
  #stage { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0 }
  svg { position:absolute; inset:0; width:1920px; height:1080px }
  text { font-family: inherit; fill: var(--ink) }
  .k { font-size:15px; font-weight:800; letter-spacing:.14em; fill:var(--mut) }
  .t { font-size:25px; font-weight:800 } .s { font-size:17px; fill:#C9C4D6 } .m { font:600 17px ui-monospace, Menlo, monospace }
  .box { fill:var(--card); stroke:var(--line); stroke-width:2.5; transition: stroke .25s, fill .25s, filter .25s }
  .on .box { stroke:var(--lemon); filter: drop-shadow(0 0 18px rgba(255,240,90,.35)) }
  .ok .box { stroke:var(--ok); filter: drop-shadow(0 0 18px rgba(53,212,154,.4)) }
  .bad .box { stroke:var(--no); filter: drop-shadow(0 0 20px rgba(255,93,143,.5)) }
  .hot .box { stroke:var(--flame); filter: drop-shadow(0 0 22px rgba(242,96,12,.55)) }
  .dim { opacity:.32 } .wire { fill:none; stroke:var(--line); stroke-width:2.5; stroke-dasharray:3 9; stroke-linecap:round }
  .wire.live { stroke:var(--lemon); stroke-dasharray:none; filter: drop-shadow(0 0 8px rgba(255,240,90,.6)) }
  .wire.hot { stroke:var(--flame); stroke-dasharray:none; filter: drop-shadow(0 0 8px rgba(242,96,12,.7)) }
  .wire.bad { stroke:var(--no); stroke-dasharray:none }
  .fade { opacity:0; transition: opacity .5s } .fade.in { opacity:1 }
  .chip { position:absolute; left:0; top:0; white-space:nowrap; font:800 17px/1 ui-monospace, Menlo, monospace; padding:9px 14px; border-radius:99px; background:var(--lemon); color:#111; box-shadow:0 0 22px rgba(255,240,90,.55); opacity:0; will-change: transform }
  .chip.key { background:var(--flame); color:#fff; box-shadow:0 0 24px rgba(242,96,12,.7) } .chip.okc { background:var(--ok); box-shadow:0 0 22px rgba(53,212,154,.6) }
  .chip.noc { background:var(--no); color:#fff; box-shadow:0 0 24px rgba(255,93,143,.7) } .chip.ans { background:#fff; box-shadow:0 0 18px rgba(255,255,255,.5) } .chip.pur { background:var(--pur); color:#111; box-shadow:0 0 22px rgba(167,139,250,.6) }
  #cap { position:absolute; left:0; right:0; bottom:0; height:155px; background:#111; display:flex; align-items:center; gap:28px; padding:0 80px; box-sizing:border-box }
  #cap i { font-style:normal; background:var(--lemon); color:#111; font-weight:800; font-size:19px; letter-spacing:.12em; padding:9px 20px; border-radius:99px; white-space:nowrap; flex:none; transition: background .3s, color .3s }
  #cap b { font-size:37px; line-height:1.28; font-weight:700; letter-spacing:-.01em; transition: opacity .22s }
  #big { position:absolute; left:0; right:0; top:0; height:925px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; background:var(--bg); z-index:5; transition: opacity .6s; text-align:center }
  #big h1 { font-size:92px; margin:0; letter-spacing:-.035em; line-height:1.04 } #big h1 em { font-style:normal; color:var(--lemon) } #big p { font-size:34px; margin:0; color:#C9C4D6 } #big .logo { position:static; width:110px; height:110px }
  .verdict { font-size:44px; font-weight:800 } .count { font-size:54px; font-weight:800 }
  .row text { transition: fill .3s } .ringbg { fill:none; stroke:#3A3550; stroke-width:9 } .ring { fill:none; stroke:var(--flame); stroke-width:9; stroke-linecap:round; transform: rotate(-90deg); transform-origin: center; transform-box: fill-box }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; } .flick { animation: flick 1.1s ease-in-out infinite alternate } @keyframes flick { to { transform: scale(1.06, 1.12) rotate(-2deg) } }
  #replay { position:absolute; right:28px; top:22px; z-index:9; font:700 16px inherit; background:transparent; color:var(--mut); border:2px solid var(--line); border-radius:99px; padding:8px 18px; cursor:pointer } #replay:hover { color:var(--ink); border-color:var(--ink) }
  .rec #replay { display:none }
</style>

      <text class="m" x="518" y="455">resend-tx</text><text class="m" x="700" y="455">api.resend.com</text><text class="s" x="926" y="455">not supported yet</text></g>

<script>
'use strict'
const Q = new URLSearchParams(location.search), PACE = Math.max(.5, Number(Q.get('speed')) || 1)
const $ = (id) => document.getElementById(id), W = (ms) => new Promise((r) => setTimeout(r, ms / PACE))
const REC = Q.has('rec')            // recording: play once, no button, say when it is over
if (REC) document.documentElement.classList.add('rec')
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080), st = $('stage'); st.style.transform = `translate(${-960 * s}px, ${-540 * s}px) scale(${s})` }
addEventListener('resize', fit); fit()
const cls = (id, c) => { const e = $(id); e.classList.remove('on', 'ok', 'bad', 'hot'); if (c) e.classList.add(c) }
const wire = (id, c) => { const e = $(id); e.classList.remove('live', 'hot', 'bad'); if (c) e.classList.add(c) }
const show = (id, on = true) => $(id).classList.toggle('in', on)
const text = (id, t, fill) => { const e = $(id); e.textContent = t; if (fill) e.setAttribute('fill', fill) }
async function say(chip, line, color) { const c = $('cap'), b = c.querySelector('b'), i = c.querySelector('i'); b.style.opacity = 0; await W(200); i.textContent = chip; i.style.background = color || 'var(--lemon)'; i.style.color = color === 'var(--no)' || color === 'var(--flame)' ? '#fff' : '#111'; b.textContent = line; b.style.opacity = 1 }
/** A chip that travels along a wire (forwards or back), then stays or goes. */
async function send(wireId, label, kind = '', { back = false, ms = 900, keep = false } = {}) {
  const p = $(wireId), len = p.getTotalLength(), el = document.createElement('div'); el.className = 'chip ' + kind; el.textContent = label; $('chips').appendChild(el)
  const w = el.offsetWidth, h = el.offsetHeight, at = (k) => { const q = p.getPointAtLength((back ? 1 - k : k) * len); return `translate(${q.x - w / 2}px, ${q.y - h / 2}px)` }
  const frames = []; for (let i = 0; i <= 24; i++) frames.push({ transform: at(i / 24), opacity: 1 })
  wire(wireId, kind === 'noc' ? 'bad' : kind === 'key' ? 'hot' : 'live')
  await el.animate(frames, { duration: ms / PACE, easing: 'cubic-bezier(.45,.05,.3,1)', fill: 'forwards' }).finished
  wire(wireId, ''); if (!keep) { await el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: 'forwards' }).finished; el.remove() }
  return el
}
let rows = 0
function trail(tag, what, color, extra = '') {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'), x = 500 + (rows % 2) * 348, y = 806 + Math.floor(rows / 2) * 34; rows++
  g.innerHTML = `<rect x="${x}" y="${y}" width="${tag.length * 11 + 22}" height="26" rx="13" fill="${color}"/><text x="${x + 11}" y="${y + 18}" font-size="13" font-weight="800" style="fill:${color === 'var(--ok)' || color === 'var(--lemon)' ? '#111' : '#fff'}">${tag}</text><text class="s" x="${x + tag.length * 11 + 32}" y="${y + 19}" font-size="15">${what}${extra}</text>`
  g.style.opacity = 0; $('trailrows').appendChild(g); g.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 380, fill: 'forwards' })
}
const ledger = (which) => { for (const k of ['lg-ask', 'lg-lit', 'lg-blocked']) show(k, k === which); $('lg-quiet').style.opacity = which ? 0 : 1 }
async function holdRing(ms) { const r = $('lg-ring'); r.setAttribute('stroke-dashoffset', 151); await r.animate([{ strokeDashoffset: 151 }, { strokeDashoffset: 0 }], { duration: ms / PACE, easing: 'linear', fill: 'forwards' }).finished }
async function seal(hash) { await send('w-store', 'thread', 'pur', { ms: 800 }); cls('store', 'on'); text('tx', 'sealed · tx ' + hash, '#A78BFA'); await W(500); cls('store', '') }
function reset() { rows = 0; $('trailrows').innerHTML = ''; $('chips').innerHTML = ''; for (const k of ['tool', 'ledger', 'sb', 'zg', 'api', 'store', 'world', 'g1', 'g2', 'g3', 'trail']) cls(k, ''); for (const k of ['w-tool', 'w-zg', 'w-api', 'w-store', 'w-world', 'w-ledger']) wire(k, '')
  text('zgv', ' '); text('gateline', ' '); text('left', '20 calls'); text('tx', 'nobody can go back and tidy it', '#8E88A0'); text('lightn', ' '); text('lights', 'lights on billing-assistant 1.0.0'); show('toolflame', false); ledger(null); $('rowbg').setAttribute('stroke', 'transparent'); $('rowbg').setAttribute('fill', 'transparent') }
const rowOn = (c) => { $('rowbg').setAttribute('stroke', c || 'transparent'); $('rowbg').setAttribute('fill', c ? 'rgba(255,240,90,.07)' : 'transparent') }

async function play() {
  reset(); $('big').style.display = 'flex'; $('big').style.opacity = 1
  await say('INSIDE', 'One call, through the switchboard.'); await W(2600)
  $('big').style.opacity = 0; await W(600); $('big').style.display = 'none'
  // ── the table ──
  await say('THE TABLE', 'On her laptop: one table. A label, where it goes, and the real key.'); cls('sb', 'on'); rowOn('var(--lemon)'); await W(3000)
  await say('THE TABLE', 'Only her Ledger can add a row. Her tool holds the label, never the key.'); cls('ledger', 'on'); cls('tool', 'on'); wire('w-ledger', 'live'); await W(3000)
  cls('sb', ''); cls('ledger', ''); cls('tool', ''); wire('w-ledger', ''); rowOn('')
  // ── a routine call ──
  await say('A ROUTINE CALL', 'The tool calls by label.'); cls('tool', 'on'); await send('w-tool', 'stripe-live · GET /v1/invoices', '', { ms: 1000 }); cls('tool', '')
  cls('g1', 'ok'); rowOn('var(--ok)'); text('gateline', '✓ a row she signed, and the call goes where the row says', '#35D49A'); await W(1100)
  await say('A ROUTINE CALL', '0G weighs it inside a sealed model. We never read it.', 'var(--pur)'); cls('g2', 'on'); await send('w-zg', 'the request', 'pur', { ms: 900 }); cls('zg', 'on'); await W(900)
  text('zgv', 'routine', '#35D49A'); cls('zg', 'ok'); await send('w-zg', 'routine · request id', 'okc', { back: true, ms: 900 }); cls('g2', 'ok'); await W(300)
  await say('A ROUTINE CALL', 'Only at the edge is the label swapped for the key.', 'var(--flame)'); cls('g3', 'hot'); await W(700); await send('w-api', '🔒 sk_•••  GET /v1/invoices', 'key', { ms: 1000 }); cls('api', 'ok'); await W(500)
  await send('w-api', 'the answer', 'ans', { back: true, ms: 800 }); cls('g3', 'ok'); text('left', '19 calls'); await send('w-tool', 'the answer · never the key', 'ans', { back: true, ms: 900 }); cls('tool', 'ok')
  trail('ALLOWED', 'read the unpaid invoices', 'var(--ok)'); await seal('0x9fb05d18…c41f')
  await say('A ROUTINE CALL', 'She was not asked. The call is on the trail, sealed in 0G Storage.'); await W(2400)
  for (const k of ['g1', 'g2', 'g3', 'api', 'zg', 'tool']) cls(k, ''); text('zgv', ' '); text('gateline', ' '); rowOn('')
  // ── a heavy call ──
  await say('A HEAVY CALL', 'A refund. The row is fine…', 'var(--flame)'); cls('tool', 'on'); await send('w-tool', 'stripe-live · POST /v1/refunds', '', { ms: 900 }); cls('tool', ''); cls('g1', 'ok'); rowOn('var(--ok)')
  cls('g2', 'on'); await send('w-zg', 'the request', 'pur', { ms: 800 }); cls('zg', 'on'); await W(700); text('zgv', 'decisive', '#F2600C'); cls('zg', 'hot'); await send('w-zg', 'decisive · request id', 'key', { back: true, ms: 800 }); cls('g2', 'hot')
  await say('A HEAVY CALL', '…but 0G says it is heavy. Nothing runs. The tool must come back with her signature.', 'var(--flame)'); text('gateline', 'NEEDS_PRESS — nothing is held open, nothing runs', '#F2600C'); await send('w-tool', 'NEEDS_PRESS', 'key', { back: true, ms: 800 }); await W(500)
  cls('ledger', 'hot'); wire('w-ledger', 'hot'); ledger('lg-ask'); await W(900); await say('A HEAVY CALL', 'Her Ledger shows the same lines it signs. She holds the button.', 'var(--flame)'); await holdRing(2600)
