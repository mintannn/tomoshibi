<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOMOSHIBI — whose light</title>
<link rel="stylesheet" href="style.css">

<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 120 152" aria-hidden="true"><rect x="31" y="96" width="58" height="48" rx="19" fill="#27407a"/><path d="M60 10 C62.2 10 63.8 12.2 64.8 14.8 C70.5 28 90 49 90 68 A30 30 0 1 1 30 68 C30 49 49.5 28 55.2 14.8 C56.2 12.2 57.8 10 60 10 Z" fill="#f0a73b"/><path d="M60 46 C61.3 46 62.2 47.2 62.8 48.6 C65.6 55 75 65.5 75 75 A15 15 0 1 1 45 75 C45 65.5 54.4 55 57.2 48.6 C57.8 47.2 58.7 46 60 46 Z" fill="#ffd98a"/></svg>
      TOMOSHIBI
    </div>
    <span class="spacer"></span>
    <span class="chip" id="status">connecting…</span>
    <div class="toggle" role="group" aria-label="Whose lights to show">
      <button id="tAll" aria-pressed="true">Everyone</button>
      <button id="tMine" aria-pressed="false">People I know</button>
    </div>
  </div>

  <ol class="journey" id="journey"></ol>

  <div class="stage">
    <canvas id="sky" aria-label="AI tools as lights in a night sky"></canvas>
    <div class="caption"><b id="capTitle"></b><span id="capSub"></span></div>
  </div>

  <section class="sheet" id="sheet" hidden></section>

  <details id="peoplePanel">
    <summary>People I know <span class="chip" id="peopleCount">0</span></summary>
    <p class="note">This list never leaves this browser. The Broker only publishes pseudonyms; who they are to you is decided here.</p>
    <div class="people" id="people"></div>
    <form class="form" id="addPerson">
      <input id="pName" placeholder="Name (only you see it)" required>
      <input id="pId" placeholder="Their pseudonym (from their device)" required>
      <select id="pTie" aria-label="How you know them"><option value="met">Met in person</option><option value="know">Know of</option></select>
      <button class="btn" type="submit">Add</button>
    </form>
  </details>
</div>

<script src="journey.js"></script>
<script src="sky.js"></script>
</html>
