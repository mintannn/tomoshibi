<text class="ttl" x="60" y="54">TOMOSHIBI — the switchboard between your agents and your keys</text>
<text class="sub" x="60" y="88">Your tools call by label. TOMOSHIBI puts the call through to the real service — or puts it to you first, when it is heavy.</text>
<g id="u-laptop">
<rect x="40" y="200" width="1120" height="545" rx="22" fill="#fffdf8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="10 8"/>
<text class="k" x="64" y="234">INSIDE THIS LAPTOP</text>
</g><!--/u-laptop-->
<g id="u-tools">
<rect class="card" x="64" y="290" width="280" height="84" rx="14"/>
<text class="h" x="86" y="324" font-size="19">Claude Code, on this PC</text>
<text class="m" x="86" y="354">calls: model-main</text>
<path d="M344 332 L386 332" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="card" x="64" y="394" width="280" height="84" rx="14"/>
<text class="h" x="86" y="428" font-size="19">the tool you are building</text>
<text class="m" x="86" y="458">calls: stripe-live</text>
<path d="M344 436 L386 436" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<g id="b1"><circle cx="365" cy="436" r="14" fill="#1b1630"/><text class="num" x="365" y="441" text-anchor="middle">1</text></g>
<rect class="card" x="64" y="498" width="280" height="84" rx="14"/>
<text class="h" x="86" y="532" font-size="19">a tool you handed out</text>
<text class="m" x="86" y="562">calls: resend-tx</text>
<path d="M344 540 L386 540" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
</g><!--/u-tools-->
<g id="u-box">
<rect class="card" x="390" y="250" width="750" height="470" rx="18"/>
<text class="h" x="414" y="288">TOMOSHIBI · the switchboard, on the laptop</text>
<text class="m" x="414" y="316">two parts: the page you look at, and the broker that holds this table</text>
</g><!--/u-box-->
<g id="u-table">
<text class="k" x="450" y="360">LABEL</text>
<text class="k" x="590" y="360">WHAT IT MAY DO</text>
<text class="k" x="1010" y="360">THE REAL KEY</text>
<path d="M414 374 L1116 374" stroke="#d8d2c6" stroke-width="2"/>
<g id="b2"><circle cx="424" cy="358" r="14" fill="#1b1630"/><text class="num" x="424" y="363" text-anchor="middle">2</text></g>
<text class="lab" x="450" y="412">model-main</text>
<text class="m" x="590" y="412">api.anthropic.com · POST /v1/messages · 2,000 calls</text>
<text class="key" x="1010" y="412">sk-ant-••••</text>
<text class="lab" x="450" y="464">stripe-live</text>
<text class="m" x="590" y="464">api.stripe.com · * /v1 · 20 calls · 7 days</text>
<text class="key" x="1010" y="464">sk_live_••••</text>
<text class="lab" x="450" y="516">resend-tx</text>
<text class="m" x="590" y="516">api.resend.com · POST /emails · 50 calls</text>
<text class="key" x="1010" y="516">re_••••</text>
<path d="M980 386 L980 588" stroke="#8f1d14" stroke-width="2.5" stroke-dasharray="7 6"/>
<text class="note" x="414" y="620">The right column is never printed, never logged, and never returned to a tool.</text>
<text class="m" x="414" y="672">What leaves this laptop: the request itself, its weight, and the trail. Never the right column.</text>
</g><!--/u-table-->
<g id="u-ledger">
<rect x="390" y="108" width="750" height="84" rx="16" fill="#FFF4EA" stroke="#f2600c" stroke-width="2.5"/>
<text class="k" x="414" y="138" fill="#c2410c">THE LEDGER · plugged into the same laptop</text>
<text class="m" x="414" y="172">hardware, in your hand — not in the laptop, and not in the cloud</text>
<path d="M765 192 L765 246" stroke="#f2600c" stroke-width="2.5" marker-end="url(#af)"/>
<g id="b4"><circle cx="765" cy="219" r="14" fill="#f2600c"/><text class="num" x="765" y="224" text-anchor="middle">4</text></g>
</g><!--/u-ledger-->
<g id="u-zg">
<text class="k" x="1200" y="234">OUTSIDE · OVER THE NETWORK</text>
<rect class="card" x="1200" y="250" width="440" height="116" rx="14" style="fill:#fffdf8"/>
<text class="k" x="1222" y="280">0G PRIVATE COMPUTER</text>
<text class="m" x="1222" y="306">weighs every request before it runs:</text>
<text class="m" x="1222" y="328">routine · significant · decisive.</text>
<text class="m" x="1222" y="350">Its operator cannot read the body</text>
<path d="M1146 306 L1196 306" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<g id="b3"><circle cx="1171" cy="282" r="14" fill="#1b1630"/><text class="num" x="1171" y="287" text-anchor="middle">3</text></g>
</g><!--/u-zg-->
<g id="u-storage">
<rect class="card" x="1200" y="372" width="440" height="116" rx="14" style="fill:#fffdf8"/>
<text class="k" x="1222" y="402">0G STORAGE</text>
<text class="m" x="1222" y="428">where the trail is sealed — the lineage</text>
<text class="m" x="1222" y="450">of one version of one tool</text>
<path d="M1146 428 L1196 428" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<g id="b7"><circle cx="1171" cy="404" r="14" fill="#1b1630"/><text class="num" x="1171" y="409" text-anchor="middle">7</text></g>
</g><!--/u-storage-->
<g id="u-world">
<rect class="card" x="1200" y="494" width="440" height="116" rx="14" style="fill:#fffdf8"/>
<text class="k" x="1222" y="524">WORLD ID</text>
<text class="m" x="1222" y="550">one person, once. The only way a light</text>
<text class="m" x="1222" y="572">comes on, and the holder's address is</text>
<text class="m" x="1222" y="594">never written into it</text>
<path d="M1146 550 L1196 550" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)"/>
<g id="b8"><circle cx="1171" cy="526" r="14" fill="#1b1630"/><text class="num" x="1171" y="531" text-anchor="middle">8</text></g>
</g><!--/u-world-->
<g id="u-services">
<rect class="card" x="1200" y="616" width="440" height="116" rx="14" style="fill:#fffdf8"/>
<text class="k" x="1222" y="646">THE REAL SERVICES</text>
<text class="m" x="1222" y="672">api.anthropic.com · api.stripe.com</text>
<text class="m" x="1222" y="694">api.resend.com</text>
<path d="M1146 672 L1196 672" stroke="#1b1630" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/>
<g id="b5"><circle cx="1171" cy="648" r="14" fill="#1b1630"/><text class="num" x="1171" y="653" text-anchor="middle">5</text></g>
<g id="b6"><circle cx="1171" cy="696" r="14" fill="#1b1630"/><text class="num" x="1171" y="701" text-anchor="middle">6</text></g>
</g><!--/u-services-->
<g id="u-order">
<text class="k" x="60" y="790">The order of one call</text>
<rect class="card" x="60" y="810" width="860" height="314" rx="16"/>
<g id="o1"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values=".32;.32;1;1;.32;.32" keyTimes="0;0.0000;0.0020;0.1171;0.1191;1"/>
<g><circle cx="96" cy="850" r="14" fill="#1b1630"/><text class="num" x="96" y="855" text-anchor="middle">1</text></g>
<text class="m" x="124" y="856">a tool calls, with a label — never a key</text>
</g>
<g id="o2"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values=".32;.32;1;1;.32;.32" keyTimes="0;0.1171;0.1191;0.2342;0.2362;1"/>
<g><circle cx="96" cy="884" r="14" fill="#1b1630"/><text class="num" x="96" y="889" text-anchor="middle">2</text></g>
<text class="m" x="124" y="890">the row is found and the range checked · outside it → DENIED, recorded</text>
</g>
<g id="o3"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values=".32;.32;1;1;.32;.32" keyTimes="0;0.2342;0.2362;0.3694;0.3714;1"/>
<g><circle cx="96" cy="918" r="14" fill="#1b1630"/><text class="num" x="96" y="923" text-anchor="middle">3</text></g>
<text class="m" x="124" y="924">0G weighs it: routine · significant · decisive · no answer → STOPPED</text>
</g>
<g id="o4"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values=".32;.32;1;1;.32;.32" keyTimes="0;0.3694;0.3714;0.5045;0.5065;1"/>
<g><circle cx="96" cy="952" r="14" fill="#f2600c"/><text class="num" x="96" y="957" text-anchor="middle">4</text></g>
<text class="m" x="124" y="958">heavy? the tool fetches a signature from the Ledger over 127.0.0.1 — good for one call</text>
</g>
<g id="o5"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values=".32;.32;1;1;.32;.32" keyTimes="0;0.5045;0.5065;0.6306;0.6326;1"/>
<g><circle cx="96" cy="986" r="14" fill="#1b1630"/><text class="num" x="96" y="991" text-anchor="middle">5</text></g>
<text class="m" x="124" y="992">one call of the count is reserved, the label is swapped for the key, and it is sent</text>
</g>
<g id="o6"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values=".32;.32;1;1;.32;.32" keyTimes="0;0.6306;0.6326;0.7477;0.7497;1"/>
<g><circle cx="96" cy="1020" r="14" fill="#1b1630"/><text class="num" x="96" y="1025" text-anchor="middle">6</text></g>
<text class="m" x="124" y="1026">the result comes back to the tool, with a hash of it. Never the key</text>
</g>
<g id="o7"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values=".32;.32;1;1;.32;.32" keyTimes="0;0.7477;0.7497;0.8739;0.8759;1"/>
<g><circle cx="96" cy="1054" r="14" fill="#1b1630"/><text class="num" x="96" y="1059" text-anchor="middle">7</text></g>
<text class="m" x="124" y="1060">the row is appended, and the thread sealed into 0G Storage</text>
</g>
<g id="o8"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values=".32;.32;1;1" keyTimes="0;0.8739;0.8759;1"/>
<g><circle cx="96" cy="1088" r="14" fill="#1b1630"/><text class="num" x="96" y="1093" text-anchor="middle">8</text></g>
<text class="m" x="124" y="1094">afterwards: World ID, one person once — a light on this version</text>
</g>
</g><!--/u-order-->
<g id="u-who">
<text class="k" x="960" y="790">Who it is for</text>
<rect x="960" y="810" width="680" height="314" rx="16" fill="#fffdf8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="8 7"/>
<text class="t" x="984" y="852">You build with Claude Code on this laptop. Shipping anything means</text>
<text class="t" x="984" y="886">collecting keys first — the model API itself, Stripe, mail — and the</text>
<text class="t" x="984" y="920">pile grows as you go. Hand a tool to someone and you are carrying</text>
<text class="t" x="984" y="954">their usage on your key. TOMOSHIBI is where those keys live: every</text>
<text class="t" x="984" y="988">tool is given a label, each label keeps a history, and only the heavy</text>
<text class="t" x="984" y="1022">calls reach your hand.</text>
</g><!--/u-who-->
<path d="M344 436 L386 436" stroke="#f2600c" stroke-width="14" stroke-linecap="round" fill="none" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;.22;.22;0;0" keyTimes="0;0.0000;0.0020;0.1171;0.1191;1"/></path><path d="M344 436 L386 436" stroke="#f2600c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0" stroke-dasharray="42" stroke-dashoffset="42"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0020;0.1171;0.1191;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="42;42;0;0;0" keyTimes="0;0.0000;0.0351;0.1171;1"/></path><rect x="64" y="394" width="280" height="84" rx="14" fill="none" stroke="#f2600c" stroke-width="4" opacity="0" stroke-dasharray="728" stroke-dashoffset="728"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0020;0.1171;0.1191;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="728;728;0;0;0" keyTimes="0;0.0000;0.0351;0.1171;1"/></rect><circle cx="96" cy="850" r="21" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0020;0.1171;0.1191;1"/></circle><text class="t" x="60" y="1208" opacity="0">The tool calls TOMOSHIBI by label — model-main, stripe-live — and never with a key.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0020;0.1171;0.1191;1"/></text><text class="t" x="60" y="1242" opacity="0">Nothing the tool holds would work anywhere else.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0020;0.1171;0.1191;1"/></text><path d="M446 424 L975 424" stroke="#f2600c" stroke-width="14" stroke-linecap="round" fill="none" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;.22;.22;0;0" keyTimes="0;0.1171;0.1191;0.2342;0.2362;1"/></path><path d="M446 424 L975 424" stroke="#f2600c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0" stroke-dasharray="529" stroke-dashoffset="529"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1171;0.1191;0.2342;0.2362;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="529;529;0;0;0" keyTimes="0;0.1171;0.1523;0.2342;1"/></path><rect x="390" y="250" width="750" height="470" rx="18" fill="none" stroke="#f2600c" stroke-width="4" opacity="0" stroke-dasharray="2440" stroke-dashoffset="2440"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1171;0.1191;0.2342;0.2362;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="2440;2440;0;0;0" keyTimes="0;0.1171;0.1523;0.2342;1"/></rect><circle cx="96" cy="884" r="21" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1171;0.1191;0.2342;0.2362;1"/></circle><text class="t" x="60" y="1208" opacity="0">Inside the switchboard: the label is found in the table and the request is checked against its range.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1171;0.1191;0.2342;0.2362;1"/></text><text class="t" x="60" y="1242" opacity="0">Outside that range the call is denied, and the denial is recorded.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1171;0.1191;0.2342;0.2362;1"/></text><path d="M1146 306 L1196 306" stroke="#f2600c" stroke-width="14" stroke-linecap="round" fill="none" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;.22;.22;0;0" keyTimes="0;0.2342;0.2362;0.3694;0.3714;1"/></path><path d="M1146 306 L1196 306" stroke="#f2600c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0" stroke-dasharray="50" stroke-dashoffset="50"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2342;0.2362;0.3694;0.3714;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="50;50;0;0;0" keyTimes="0;0.2342;0.2748;0.3694;1"/></path><rect x="1200" y="250" width="440" height="116" rx="14" fill="none" stroke="#f2600c" stroke-width="4" opacity="0" stroke-dasharray="1112" stroke-dashoffset="1112"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2342;0.2362;0.3694;0.3714;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="1112;1112;0;0;0" keyTimes="0;0.2342;0.2748;0.3694;1"/></rect><circle cx="96" cy="918" r="21" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2342;0.2362;0.3694;0.3714;1"/></circle><text class="t" x="60" y="1208" opacity="0">TOMOSHIBI ⇄ 0G Private Computer: the request body goes out to be weighed and comes back as routine,<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2342;0.2362;0.3694;0.3714;1"/></text><text class="t" x="60" y="1242" opacity="0">significant or decisive. That model’s operator cannot read the body. No answer means the call stops.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2342;0.2362;0.3694;0.3714;1"/></text><path d="M765 192 L765 246" stroke="#f2600c" stroke-width="14" stroke-linecap="round" fill="none" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;.22;.22;0;0" keyTimes="0;0.3694;0.3714;0.5045;0.5065;1"/></path><path d="M765 192 ibuteName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6306;0.6326;0.7477;0.7497;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="50;50;0;0;0" keyTimes="0;0.6306;0.6658;0.7477;1"/></path><rect x="1200" y="616" width="440" height="116" rx="14" fill="none" stroke="#f2600c" stroke-width="4" opacity="0" stroke-dasharray="1112" stroke-dashoffset="1112"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6306;0.6326;0.7477;0.7497;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="1112;1112;0;0;0" keyTimes="0;0.6306;0.6658;0.7477;1"/></rect><circle cx="96" cy="1020" r="21" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6306;0.6326;0.7477;0.7497;1"/></circle><text class="t" x="60" y="1208" opacity="0">The real service → TOMOSHIBI → the tool: the result comes back, with a hash of it.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6306;0.6326;0.7477;0.7497;1"/></text><text class="t" x="60" y="1242" opacity="0">The key does not come back, and the tool never sees it.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6306;0.6326;0.7477;0.7497;1"/></text><path d="M1146 428 L1196 428" stroke="#f2600c" stroke-width="14" stroke-linecap="round" fill="none" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;.22;.22;0;0" keyTimes="0;0.7477;0.7497;0.8739;0.8759;1"/></path><path d="M1146 428 L1196 428" stroke="#f2600c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0" stroke-dasharray="50" stroke-dashoffset="50"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7477;0.7497;0.8739;0.8759;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="50;50;0;0;0" keyTimes="0;0.7477;0.7856;0.8739;1"/></path><rect x="1200" y="372" width="440" height="116" rx="14" fill="none" stroke="#f2600c" stroke-width="4" opacity="0" stroke-dasharray="1112" stroke-dashoffset="1112"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7477;0.7497;0.8739;0.8759;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="1112;1112;0;0;0" keyTimes="0;0.7477;0.7856;0.8739;1"/></rect><circle cx="96" cy="1054" r="21" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7477;0.7497;0.8739;0.8759;1"/></circle><text class="t" x="60" y="1208" opacity="0">TOMOSHIBI → 0G Storage: the row is appended and the thread sealed. The trail is written to be public,<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7477;0.7497;0.8739;0.8759;1"/></text><text class="t" x="60" y="1242" opacity="0">and it holds no request body and no key.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7477;0.7497;0.8739;0.8759;1"/></text><path d="M1146 550 L1196 550" stroke="#f2600c" stroke-width="14" stroke-linecap="round" fill="none" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;.22;.22" keyTimes="0;0.8739;0.8759;1"/></path><path d="M1146 550 L1196 550" stroke="#f2600c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0" stroke-dasharray="50" stroke-dashoffset="50"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8739;0.8759;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="50;50;0;0;0" keyTimes="0;0.8739;0.9117;1.0000;1"/></path><rect x="1200" y="494" width="440" height="116" rx="14" fill="none" stroke="#f2600c" stroke-width="4" opacity="0" stroke-dasharray="1112" stroke-dashoffset="1112"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8739;0.8759;1"/><animate attributeName="stroke-dashoffset" dur="22.2s" repeatCount="indefinite" values="1112;1112;0;0;0" keyTimes="0;0.8739;0.9117;1.0000;1"/></rect><circle cx="96" cy="1088" r="21" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8739;0.8759;1"/></circle><text class="t" x="60" y="1208" opacity="0">Afterwards → World ID: one verified person, once, can light this version of this tool.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8739;0.8759;1"/></text><text class="t" x="60" y="1242" opacity="0">That is what makes a count of lights worth reading.<animate attributeName="opacity" dur="22.2s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8739;0.8759;1"/></text></svg>
<p>The links light up one at a time, and the line under the figure says what that link carries. It loops. Step 4 is the only link with a person in it — and most calls never reach it.</p>
