<rect x="960" y="810" width="680" height="314" rx="16" fill="#fffdf8" stroke="#1b1630" stroke-width="2.5" stroke-dasharray="8 7"/>
<text class="t" x="984" y="852">You build with Claude Code on this laptop. Shipping anything means</text>
<text class="t" x="984" y="886">collecting keys first — the model API itself, Stripe, mail — and the</text>
<text class="t" x="984" y="920">pile grows as you go. Hand a tool to someone and you are carrying</text>
<text class="t" x="984" y="954">their usage on your key. TOMOSHIBI is where those keys live: every</text>
<text class="t" x="984" y="988">tool is given a label, each label keeps a history, and only the heavy</text>
<text class="t" x="984" y="1022">calls reach your hand.</text>

;1"/></circle><g opacity="0"><circle r="13" fill="#f2600c" stroke="#fff" stroke-width="3"/><animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8496;0.8496;0.8822;0.8822;1"/><animateMotion dur="39.900000000000006s" repeatCount="indefinite" path="M1420 672 L1146 672 L800 470" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8496;0.8822;1"/></g><circle cx="96" cy="1020" r="20" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8496;0.8496;0.8822;0.8822;1"/></circle><g opacity="0"><circle r="13" fill="#f2600c" stroke="#fff" stroke-width="3"/><animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8822;0.8822;0.9148;0.9148;1"/><animateMotion dur="39.900000000000006s" repeatCount="indefinite" path="M800 470 L1146 428 L1420 428" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8822;0.9148;1"/></g><circle cx="96" cy="1054" r="20" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8822;0.8822;0.9148;0.9148;1"/></circle><g opacity="0"><circle r="13" fill="#f2600c" stroke="#fff" stroke-width="3"/><animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.9148;0.9148;0.9474;0.9474;1"/><animateMotion dur="39.900000000000006s" repeatCount="indefinite" path="M800 470 L1146 550 L1420 550" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.9148;0.9474;1"/></g><circle cx="96" cy="1088" r="20" fill="none" stroke="#f2600c" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.9148;0.9148;0.9474;0.9474;1"/></circle><g opacity="0"><circle r="13" fill="#f2600c" stroke="#fff" stroke-width="3"/><animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.9474;0.9474;0.9699;0.9699;1"/><animateMotion dur="39.900000000000006s" repeatCount="indefinite" path="M800 470 L800 470" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.9474;0.9699;1"/></g><text class="t" x="60" y="1208" opacity="0">One laptop. Everything drawn inside this line is yours — your agent, your tools, your keys.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0040;0.0652;0.0652;1"/></text><text class="t" x="60" y="1208" opacity="0">The tools ask by label: model-main, stripe-live. A label is worth nothing anywhere else,<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0652;0.0692;0.1303;0.1303;1"/></text><text class="t" x="60" y="1242" opacity="0">and nothing in here is ever handed a key.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0652;0.0692;0.1303;0.1303;1"/></text><text class="t" x="60" y="1208" opacity="0">TOMOSHIBI sits between them. Two parts: a page you look at, and a broker that holds the table.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1303;0.1343;0.1955;0.1955;1"/></text><text class="t" x="60" y="1208" opacity="0">The table is the whole trick — label, what it may do, the real key.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1955;0.1995;0.2607;0.2607;1"/></text><text class="t" x="60" y="1242" opacity="0">The right column never leaves this laptop.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1955;0.1995;0.2607;0.2607;1"/></text><text class="t" x="60" y="1208" opacity="0">The Ledger is hardware, in your hand. It is the only thing that can add a row to that table,<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2607;0.2647;0.3258;0.3258;1"/></text><text class="t" x="60" y="1242" opacity="0">and the only thing that can approve a heavy call.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2607;0.2647;0.3258;0.3258;1"/></text><text class="t" x="60" y="1208" opacity="0">0G Private Computer weighs each request before it runs. If it does not answer the call stops —<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3258;0.3298;0.3910;0.3910;1"/></text><text class="t" x="60" y="1242" opacity="0">there is no fallback judgement.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3258;0.3298;0.3910;0.3910;1"/></text><text class="t" x="60" y="1208" opacity="0">Only at this crossing is the label swapped for the key, and only for the one call that was allowed.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3910;0.3950;0.4561;0.4561;1"/></text><text class="t" x="60" y="1208" opacity="0">The row is appended, and the thread sealed into 0G Storage. Nobody can go back and tidy it.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4561;0.4601;0.5213;0.5213;1"/></text><text class="t" x="60" y="1208" opacity="0">World ID: one person, once. That is what makes a count of stars worth reading at all.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5213;0.5253;0.5865;0.5865;1"/></text><text class="t" x="60" y="1208" opacity="0">Eight steps, in order. Only step 4 has a person in it — and most calls never reach it.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5865;0.5905;0.6516;0.6516;1"/></text><text class="t" x="60" y="1208" opacity="0">Now one call, moving through it.<animate attributeName="opacity" dur="39.900000000000006s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6516;0.6556;0.9699;0.9699;1"/></text></svg>
<p>The figure writes itself out a piece at a time, saying what each piece is for; then one call walks the eight steps. It loops. Step 4, in orange, is the only one a person is in — and most calls never reach it.</p>
